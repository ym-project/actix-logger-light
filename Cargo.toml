[package]
name = "actix-logger-light"
version = "0.1.0"
rust-version = "1.94"
edition = "2024"
license = "MIT"
authors = ["ym-project <ym-project@protonmail.com>"]
description = "Logger middleware for Actix Web"
keywords = ["actix", "web", "actix-web", "logger", "middleware"]
repository = "https://github.com/ym-project/actix-logger-light/tree/v4"
exclude = [
	".github",
	".vscode",
	".editorconfig",
	".gitignore",
	"rust-toolchain.toml",
	"rustfmt.toml",
]

[dev-dependencies]
actix-web = { version = "4.13.0", default-features = false, features = [
	"macros",
] }
log = { version = "0.4.29", features = ["std"] }

[dependencies]
actix-web = { version = "4.13.0", default-features = false }
time = { version = "0.3", default-features = false, features = ["std"] }
log = { version = "0.4.29", default-features = false }
pin-project-lite = { version = "0.2.16", default-features = false }
